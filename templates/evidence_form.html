{% extends "base.html" %}

{% block main %}

<div class="valign-wrapper" style="height:100%;">
    <div class="row">
        <div class="col-s4"></div>
        <div class="col-s4">
            <div class="card">
        <div class="card-image gd-black">
        <img 
          src="https://images.pexels.com/photos/7134986/pexels-photo-7134986.jpeg?cs=srgb&dl=pexels-gradienta-7134986.jpg&fm=jpg" 
          height=100
          alt="">
          <span class="card-title black-text">Submit Evidence</span>
        </div>
        <div class="card-content">
            <p>Submit evidence to potentially resolve disputed chaeges</p>
            <div class="divider"></div>
            <form action="" method="post" id="dispute-form">
                {% csrf_token %}
                {{ form }}
            </form>
        </div>
        <div class="card-action">
            <button type="submit" class="btn blue white-text" form="dispute-form">
                Submit Evidence
            </button>
        </div>
    </div>    
        </div>
        <div class="col-s4"></div>
    </div>
    
</div>
{% endblock main %}
