{% extends "base.html" %}
{% load static %}

{% block title %}
Card Now, Charge Later
{% endblock title %}

{% block main %}
<div class="container">
    <div class="row">
        <div class="col s8 offset-s2">
            <div class="card">
                <div class="card-content">
                    <span class="card-title">Provide Payment Information</span>
                    <span>You will not be charged at this time</span>
                    <div class="divider"></div>
                    <form action="" id="setup-form" data-return-url="{{return_url}}" style="padding: 1em 0;">
                        {% csrf_token %}
                        <input type="hidden" name="client-secret" id="client-secret" value="{{setup_intent}}">
                        <input type="hidden" name="customer-id" id="customer-id" value="{{customer_id}}">
                        <div id="payment-element"></div>
                        <div class="divider" style=""></div>
                        <div id="error-message" style="display: none;"></div>
                    </form>
                </div>
                <div class="card-action center-align">
                    <button type="submit" class="flex-button" form="setup-form">Save Payment Method</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock main %}

{% block script %}
<script src="{% static 'js/setup_intent.js' %}"></script>
{% endblock script %}
