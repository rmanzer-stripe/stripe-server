{% extends 'base.html' %}
{% load payment_extras %}

{% block title %}
    Invoices
{% endblock title %}

{% block main %}
    <div class="container">
        <div class="row">
            <div class="col s8 offset-s2">
                <div class="card">
                    <div class="card-image">
                        <img 
                          src="https://images.pexels.com/photos/7319358/pexels-photo-7319358.jpeg?cs=srgb&dl=pexels-cottonbro-7319358.jpg&fm=jpg" 
                          height=400
                          alt="">
                        <span class="card-title">Invoice Phillip Marlowe</span>
                    </div>
                    <div class="card-content" >
                        <p>Select the price for the <code>InvoiceItem</code> </p>
                        <form action="" method="POST" id="invoice-price" style="min-height: 5em;">
                            {% csrf_token %}
                            <div class="input-field col s12">
                                <select name="price_id" id="price_id">
                                    {% for price in prices %}
                                        <option value="{{price.id}}">{{price.unit_amount}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="card-action center-align">
                        <button type="submit" class="flex-button" form="invoice-price">Invoice</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
{% endblock main %}
