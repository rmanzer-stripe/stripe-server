{% extends 'base.html' %}
{% load static %}
{% block title %}
    Payment Info
{% endblock title %}

{% block main %}
<div class="container">
    <div class="row">
        <div class="col s8 offset-s2">
            <div class="card">
                <div class="card-content">
                    <span class="card-title">Provide Payment Info</span>
                    <form action="" id="payment-form">
                        <div id="payment-element"></div>
                    </form>
                </div>
                <div class="card-action">
                    <button type="submit" class="flex-button">Submit Info</button>
                    <div id="error-message"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock main %}

{% block script %}
    <script src="{% static 'js/subscribe.js' %} "></script>
{% endblock script %}
